# =============================================================================
# Docker Compose — Aplikasi Inventori Warkop Kiwil (VPS Production)
#
# Services:
#   1. app     — Node.js (Express + React build) di port 5000
#   2. nginx   — Reverse proxy + SSL termination (Let's Encrypt)
#
# Database: Supabase PostgreSQL (cloud) — tidak perlu container lokal
#
# Cara Pakai:
#   1. Salin .env.example → .env, isi semua variabel
#   2. docker compose up -d --build
#   3. Jalankan certbot untuk SSL (lihat README)
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # APP — Backend Express + Frontend React (single container)
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: warkop-kiwil-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=5000
    expose:
      - "5000"
    networks:
      - warkop-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ---------------------------------------------------------------------------
  # NGINX — Reverse Proxy + SSL Termination
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: warkop-kiwil-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - warkop-net

  # ---------------------------------------------------------------------------
  # CERTBOT — SSL Certificate (Let's Encrypt) — jalankan manual
  # ---------------------------------------------------------------------------
  certbot:
    image: certbot/certbot
    container_name: warkop-kiwil-certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do sleep 6h & wait $${!}; done;'"
    networks:
      - warkop-net

networks:
  warkop-net:
    driver: bridge
