# =============================================================================
# Docker Compose — Aplikasi Inventori Warkop Kiwil (VPS Production)
#
# Service:
#   app — Fullstack Container: Node.js (Express) + React Production Build
#
# Database: Supabase PostgreSQL (Cloud Managed)
# =============================================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: warkop-kiwil-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=5000
    ports:
      - "80:5000"     # Akses langsung via domain/IP (HTTP standard port 80)
      - "5000:5000"   # Akses via port internal 5000
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
