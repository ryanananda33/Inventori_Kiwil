# =============================================================================
# Nginx Configuration — Warkop Kiwil Reverse Proxy
#
# Tahap 1: Gunakan konfigurasi HTTP-only (untuk generate SSL cert pertama kali)
# Tahap 2: Uncomment blok HTTPS setelah sertifikat berhasil digenerate
# =============================================================================

# --- Rate Limiting Zone ---
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=5r/s;

# =============================================================================
# SERVER — HTTP (Port 80) → Redirect ke HTTPS + Certbot challenge
# =============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN_ANDA www.DOMAIN_ANDA;

    # Certbot ACME challenge (untuk generate/renew SSL)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect semua HTTP → HTTPS (aktifkan setelah SSL ready)
    # location / {
    #     return 301 https://$host$request_uri;
    # }

    # === TAHAP 1: Sementara pakai HTTP dulu (hapus blok ini setelah SSL aktif) ===
    location / {
        proxy_pass http://app:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Rate limiting
        limit_req zone=general burst=20 nodelay;
    }
    # === END TAHAP 1 ===
}

